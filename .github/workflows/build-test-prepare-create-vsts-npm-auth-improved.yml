name: Build and test create-vsts-npm-auth-improved

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test create-vsts-npm-auth-improved
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash
        working-directory: projects/create-vsts-npm-auth-improved

    steps:
      - name: Check out the event commit
        uses: actions/checkout@v6
        with:
          ref: ${{ github.sha }}

      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24.18.1
          package-manager-cache: false

      - name: Set up npm
        run: npm install --global npm@12.0.2

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Test
        run: npm test
