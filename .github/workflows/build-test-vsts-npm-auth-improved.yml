name: Build and test vsts-npm-auth-improved

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test vsts-npm-auth-improved
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
        working-directory: projects/vsts-npm-auth-improved
    env:
      NODE_VERSION: 24.18.1
      NPM_VERSION: 12.0.2
    steps:
      - name: Check out the event commit
        uses: actions/checkout@v6
      - name: Set up Node.js
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: projects/vsts-npm-auth-improved/package-lock.json
      - name: Set up npm
        run: npm install --global "npm@$env:NPM_VERSION"
      - name: Install dependencies
        run: npm ci
      - name: Build
        run: npm run build
      - name: Test
        run: npm test
