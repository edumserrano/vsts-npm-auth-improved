name: Publish package
run-name: Publish package ${{ inputs.package_name }} (${{ inputs.source_sha }})

on:
  workflow_call:
    inputs:
      package_name:
        description: npm package to publish
        required: true
        type: string
      source_sha:
        description: Exact merged release commit
        required: true
        type: string

defaults:
  run:
    shell: pwsh

env:
  NODE_VERSION: 24.18.1
  NPM_VERSION: 12.0.2
  PACKAGE_NAME: ${{ inputs.package_name }}
  PACKAGE_DIRECTORY: projects/${{ inputs.package_name }}

jobs:
  publish:
    name: Publish ${{ inputs.package_name }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
    environment: npm-publish
    concurrency:
      group: npm-publish-${{ inputs.package_name }}
      cancel-in-progress: false
      queue: max
    env:
      SOURCE_SHA: ${{ inputs.source_sha }}
    steps:
      - name: Check out release commit
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.source_sha }}
          fetch-tags: true
          persist-credentials: false
      - name: Set up Node.js
        id: setup-node
        uses: actions/setup-node@v6
        with:
          node-version: ${{ env.NODE_VERSION }}
          registry-url: https://registry.npmjs.org/
          cache: npm
          cache-dependency-path: ${{ env.PACKAGE_DIRECTORY }}/package-lock.json
      - name: Set up npm and read release values
        id: release
        working-directory: ${{ env.PACKAGE_DIRECTORY }}
        run: |
          npm install --global "npm@$env:NPM_VERSION"
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::Could not install npm $env:NPM_VERSION."
            exit 1
          }

          $manifest = Get-Content package.json -Raw | ConvertFrom-Json
          $version = [string]$manifest.version
          if ([string]::IsNullOrWhiteSpace($version)) {
            Write-Output "::error::package.json does not contain a version."
            exit 1
          }

          $distTag = "latest"
          $versionWithoutBuildMetadata = $version.Split("+", 2)[0]
          $versionParts = $versionWithoutBuildMetadata.Split("-", 2)
          if ($versionParts.Count -eq 2) {
            $distTag = $versionParts[1].Split(".", 2)[0]
            if ($distTag -notin @("alpha", "beta", "rc")) {
              Write-Output "::error::Unsupported prerelease channel: $distTag"
              exit 1
            }
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "dist_tag=$distTag" >> $env:GITHUB_OUTPUT
          "git_tag=$env:PACKAGE_NAME@$version" >> $env:GITHUB_OUTPUT
          Write-Output "version=$version"
          Write-Output "dist_tag=$distTag"
          Write-Output "git_tag=$env:PACKAGE_NAME@$version"
      - name: Install dependencies
        working-directory: ${{ env.PACKAGE_DIRECTORY }}
        run: npm ci
      - name: Build and pack
        id: package
        working-directory: ${{ env.PACKAGE_DIRECTORY }}
        env:
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          npm run pack
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::Could not build and pack $env:PACKAGE_NAME@$env:VERSION."
            exit 1
          }

          $packageDirectory = Join-Path $env:GITHUB_WORKSPACE "$env:PACKAGE_DIRECTORY/dist/$env:PACKAGE_NAME-package"
          $tarball = Join-Path $packageDirectory "$env:PACKAGE_NAME-$env:VERSION.tgz"
          if (-not (Test-Path $tarball -PathType Leaf)) {
            Write-Output "::error::Expected release tarball was not created: $tarball"
            exit 1
          }

          "tarball=$tarball" >> $env:GITHUB_OUTPUT
      - name: Inspect release tarball
        working-directory: ${{ env.PACKAGE_DIRECTORY }}
        env:
          PACKAGE: ${{ env.PACKAGE_NAME }}
          VERSION: ${{ steps.release.outputs.version }}
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          $entries = @(tar -tzf $env:TARBALL)
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::Could not read release tarball $env:TARBALL."
            exit 1
          }

          foreach ($required in @("package/LICENSE", "package/README.md", "package/package.json", "package/cjs/main.js")) {
            if ($entries -notcontains $required) {
              Write-Output "::error::Release tarball is missing $required."
              exit 1
            }
          }

          $developmentEntries = @(
            $entries | Where-Object { $_ -match '(^|/)(tests?|test-reporters|coverage|node_modules)(/|$)|(^|/)\.npmrc$' }
          )
          if ($developmentEntries.Count -gt 0) {
            Write-Output "::error::Release tarball contains development files or npm credentials: $($developmentEntries -join ', ')"
            exit 1
          }

          try {
            $manifestContent = @(tar -xOzf $env:TARBALL package/package.json)
            if ($LASTEXITCODE -ne 0) { throw "Could not extract package/package.json" }
            $manifest = ($manifestContent -join [Environment]::NewLine) | ConvertFrom-Json
            $checks = [ordered]@{
              "package name" = $manifest.name -eq $env:PACKAGE
              "package version" = $manifest.version -eq $env:VERSION
              "MIT license" = $manifest.license -eq "MIT"
              "CLI binary" = $manifest.bin.PSObject.Properties[$env:PACKAGE].Value -eq "cjs/main.js"
              "repository URL" = $manifest.repository.url -eq "git+https://github.com/edumserrano/vsts-npm-auth-improved.git"
              "repository directory" = $manifest.repository.directory -eq $env:PACKAGE_DIRECTORY
              "public access" = $manifest.publishConfig.access -eq "public"
              "public registry" = $manifest.publishConfig.registry -eq "https://registry.npmjs.org/"
              "runtime dependencies" = @($manifest.dependencies.PSObject.Properties).Count -gt 0
              "no development dependencies" = $null -eq $manifest.PSObject.Properties["devDependencies"]
              "no development scripts" = $null -eq $manifest.PSObject.Properties["scripts"]
            }
            foreach ($check in $checks.GetEnumerator()) {
              if (-not $check.Value) { throw "Generated manifest failed check: $($check.Key)" }
            }
          } catch {
            Write-Output "::error::$($_.Exception.Message)"
            exit 1
          }
      - name: Smoke-test release tarball
        working-directory: ${{ env.PACKAGE_DIRECTORY }}
        env:
          VERSION: ${{ steps.release.outputs.version }}
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: |
          $actualVersion = ((npx --yes --package $env:TARBALL $env:PACKAGE_NAME --version) -join "").Trim()
          if ($LASTEXITCODE -ne 0 -or $actualVersion -ne $env:VERSION) {
            Write-Output "::error::CLI reported $actualVersion instead of $env:VERSION."
            exit 1
          }

          npx --yes --package $env:TARBALL $env:PACKAGE_NAME --help > $null
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::Release tarball help smoke test failed."
            exit 1
          }
      - name: Confirm release tag does not exist
        working-directory: ${{ env.PACKAGE_DIRECTORY }}
        env:
          GIT_TAG: ${{ steps.release.outputs.git_tag }}
        run: |
          git show-ref --verify --quiet "refs/tags/$env:GIT_TAG"
          $tagStatus = $LASTEXITCODE
          if ($tagStatus -eq 0) {
            Write-Output "::error::Git tag $env:GIT_TAG already exists."
            exit 1
          }

          if ($tagStatus -ne 1) {
            Write-Output "::error::Could not determine whether Git tag $env:GIT_TAG exists."
            exit 1
          }

          Write-Output "Git tag $env:GIT_TAG is available."
      - name: Publish to npm
        id: publish-npm
        working-directory: ${{ env.PACKAGE_DIRECTORY }}
        env:
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
          TARBALL: ${{ steps.package.outputs.tarball }}
        run: npm publish $env:TARBALL --access public --tag $env:DIST_TAG --registry=https://registry.npmjs.org/
      - name: Create and push release tag
        id: create-release-tag
        working-directory: ${{ env.PACKAGE_DIRECTORY }}
        env:
          GH_TOKEN: ${{ github.token }}
          GIT_TAG: ${{ steps.release.outputs.git_tag }}
          VERSION: ${{ steps.release.outputs.version }}
        run: |
          gh auth setup-git
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::Could not configure Git authentication."
            exit 1
          }

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag --annotate $env:GIT_TAG $env:SOURCE_SHA --message "Release $env:PACKAGE_NAME@$env:VERSION"
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::Could not create release tag $env:GIT_TAG."
            exit 1
          }
          
          git push origin "refs/tags/$env:GIT_TAG"
          if ($LASTEXITCODE -ne 0) {
            Write-Output "::error::Could not push release tag $env:GIT_TAG."
            exit 1
          }
      - name: Add publish summary
        if: ${{ always() }}
        working-directory: ${{ github.workspace }}
        env:
          VERSION: ${{ steps.release.outputs.version }}
          DIST_TAG: ${{ steps.release.outputs.dist_tag }}
          SOURCE_COMMIT: ${{ inputs.source_sha }}
          CACHE_HIT: ${{ steps.setup-node.outputs.cache-hit }}
          PUBLISH_OUTCOME: ${{ steps.publish-npm.outcome }}
          CREATE_TAG_OUTCOME: ${{ steps.create-release-tag.outcome }}
        run: |
          $summaryParameters = @{
            PackageName = $env:PACKAGE_NAME
            Version = $env:VERSION
            DistTag = $env:DIST_TAG
            SourceCommit = $env:SOURCE_COMMIT
            CacheHit = $env:CACHE_HIT
            PublishOutcome = $env:PUBLISH_OUTCOME
            CreateTagOutcome = $env:CREATE_TAG_OUTCOME
          }
          ./.github/scripts/write-publish-package-summary.ps1 @summaryParameters
